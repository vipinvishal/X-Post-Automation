name: Daily X Post

on:
  schedule:
    - cron: '30 3 * * *'   #  9:00 AM IST (UTC+5:30)
    - cron: '30 7 * * *'   #  1:00 PM IST (UTC+5:30)
    - cron: '30 13 * * *'  #  7:00 PM IST (UTC+5:30)
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

permissions:
  contents: write   # needed to commit scripts/post_log.json back after a post

# Queue (don't cancel) overlapping runs so the cadence guard's read-then-write
# of post_log.json can never race between a cron run and a manual trigger.
concurrency:
  group: daily-x-post
  cancel-in-progress: false

# Force Node.js 24 for all actions (suppresses Node.js 20 deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for infographic rendering)
        run: python -m playwright install --with-deps chromium

      - name: Generate and schedule post
        run: python scripts/generate_and_schedule.py
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:   ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          EURON_API_KEY:      ${{ secrets.EURON_API_KEY }}
          EXA_API_KEY:        ${{ secrets.EXA_API_KEY }}
          BUFFER_API_KEY:     ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID:  ${{ secrets.BUFFER_CHANNEL_ID }}
          # Infographic image: IMGBB_API_KEY hosts the PNG so Buffer can attach it.
          # If the secret is unset, the run auto-falls back to a text-only post.
          IMGBB_API_KEY:      ${{ secrets.IMGBB_API_KEY }}
          INFOGRAPHIC_HANDLE: ${{ vars.INFOGRAPHIC_HANDLE || '@VipinAILabs' }}
          MAX_POSTS_PER_DAY:      ${{ vars.MAX_POSTS_PER_DAY || '3' }}
          MIN_POST_SPACING_HOURS: ${{ vars.MIN_POST_SPACING_HOURS || '3.5' }}

      - name: Commit updated post log
        if: always()
        run: |
          if [ -n "$(git status --porcelain scripts/post_log.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/post_log.json
            git commit -m "chore: record post timestamp [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "post_log.json unchanged — nothing to commit."
          fi
